[package]
name = "kestrel-rs"
version = "0.0.1"
edition = "2021"
description = "A keyboard-first, customizable desktop browser shell, built on Servo"
license = "MIT"
repository = "https://github.com/The-SudoStart/kestrel-rs"

[dependencies]
# GUI framework — see ARCHITECTURE.md for why Iced was chosen.
# We use the low-level Iced crates (not the high-level `iced` facade)
# because we need to integrate Iced's rendering into our own winit
# ApplicationHandler alongside Servo. See the `integration` example:
# https://github.com/iced-rs/iced/tree/master/examples/integration
iced_winit = "0.14"
iced_wgpu = "0.14"
iced_runtime = "0.14"
iced_widget = "0.14"
futures = "0.3"

# Servo embedding — verified against crates.io (v0.5.0, released 2026-08-17).
# See docs/servo-embedding-notes.md for API surface notes.
servo = { version = "0.5", default-features = true }

# Servo embedding requires winit for the event loop and window management.
# Both Servo (dev dep) and Iced (via iced_winit) use winit ^0.30.
winit = "0.30"

# Supporting crates used by Servo's embedding API
url = "2"
webrender_api = "0.70"
euclid = "0.22"

# Logging (Servo uses tracing internally)
tracing = "0.1"
tracing-subscriber = "0.3"

# TLS provider (required by Servo's networking stack)
rustls = { version = "0.23", features = ["aws-lc-rs"] }

[profile.dev]
# Servo/Iced debug builds are slow to compile — opt-level 1 for deps
# speeds up iteration without sacrificing much debuggability.
opt-level = 1

[profile.release]
opt-level = 3
lto = true
