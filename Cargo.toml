[package]
name = "kestrel-rs"
version = "0.0.1"
edition = "2021"
description = "A keyboard-first, customizable desktop browser shell, built on Servo"
license = "MIT"
repository = "https://github.com/The-SudoStart/kestrel-rs"

[dependencies]
# GUI framework — see ARCHITECTURE.md for why Iced was chosen
iced = "0.13"

# Servo embedding — VERIFY exact crate name/version against current
# crates.io listing before Phase 0 work starts. Servo's embedding API is
# young (0.1.x as of mid-2026) and crate naming may shift. Do not assume
# this line is correct without checking servo.org / crates.io first.
# servo = "0.1"

[profile.dev]
# Servo/Iced debug builds can be slow to compile repeatedly — opt-level 1
# for dependencies speeds up iteration without sacrificing much.
opt-level = 0

[profile.release]
opt-level = 3
lto = true
